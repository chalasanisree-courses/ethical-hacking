<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Passive sniffing on a hub: the hub repeats every packet to every port, so the attacker receives a copy of everyone's traffic just by listening." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="520" height="300" fill="#fbfbfd" rx="12"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" font-weight="800" fill="#26324f">Passive — on a hub, just listen</text>

  <!-- hub -->
  <rect x="196" y="44" width="128" height="42" rx="9" fill="#3FA76B"/>
  <text x="260" y="63" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">HUB</text>
  <text x="260" y="78" text-anchor="middle" fill="#e4f5ec" font-size="9.5">repeats to every port</text>

  <!-- lines hub -> each device (all get a copy) -->
  <g stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4">
    <line x1="260" y1="86" x2="66"  y2="208"/>
    <line x1="260" y1="86" x2="192" y2="208"/>
    <line x1="260" y1="86" x2="322" y2="208"/>
    <line x1="260" y1="86" x2="452" y2="208"/>
  </g>
  <!-- copy dots -->
  <g fill="#c0392b"><circle cx="150" cy="159" r="4.5"/><circle cx="217" cy="159" r="4.5"/><circle cx="296" cy="159" r="4.5"/><circle cx="384" cy="159" r="4.5"/></g>

  <!-- devices -->
  <g>
    <rect x="26"  y="208" width="80" height="50" rx="7" fill="#E6F1FB" stroke="#b6cfe8"/>
    <text x="66"  y="230" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0C447C">Alice</text>
    <text x="66"  y="247" text-anchor="middle" font-size="9.5" fill="#3b6ea5">sends</text>

    <rect x="152" y="208" width="80" height="50" rx="7" fill="#E6F1FB" stroke="#b6cfe8"/>
    <text x="192" y="233" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0C447C">Bob</text>

    <rect x="282" y="208" width="80" height="50" rx="7" fill="#E6F1FB" stroke="#b6cfe8"/>
    <text x="322" y="233" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0C447C">Carol</text>

    <rect x="412" y="208" width="84" height="50" rx="7" fill="#C0392B"/>
    <text x="454" y="230" text-anchor="middle" font-size="11.5" font-weight="800" fill="#fff">Attacker</text>
    <text x="454" y="247" text-anchor="middle" font-size="9.5" fill="#f7d9d5">gets a copy</text>
  </g>

  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#6b7280">Every packet hits every port — the attacker just listens, sends nothing.</text>
</svg>
