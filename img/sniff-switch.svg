<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Active sniffing on a switch: the switch would send Alice's traffic straight to the gateway, but ARP spoofing forces it to detour through the attacker, who sits in the middle and relays it on." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="520" height="300" fill="#fbfbfd" rx="12"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" font-weight="800" fill="#26324f">Active — the attacker sits in the middle</text>

  <!-- switch on top -->
  <rect x="205" y="44" width="110" height="38" rx="9" fill="#0E6B82"/>
  <text x="260" y="62" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="800">SWITCH</text>
  <text x="260" y="75" text-anchor="middle" fill="#cfe6ec" font-size="9">one port each</text>

  <!-- faded "normal" path: Alice -> switch -> gateway -->
  <g stroke="#cfd6e0" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <path d="M 78 214 L 235 82"/>
    <path d="M 285 82 L 442 214"/>
  </g>
  <text x="260" y="104" text-anchor="middle" font-size="9" fill="#aab2bf">normal path (blocked to the attacker)</text>

  <!-- devices row -->
  <rect x="30"  y="214" width="96" height="56" rx="8" fill="#2B6CB0"/>
  <text x="78"  y="238" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">Alice</text>
  <text x="78"  y="255" text-anchor="middle" fill="#d6e4f5" font-size="9.5">victim</text>

  <rect x="200" y="208" width="120" height="66" rx="8" fill="#C0392B"/>
  <text x="260" y="234" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="800">Attacker</text>
  <text x="260" y="251" text-anchor="middle" fill="#f7d9d5" font-size="9.5">in the middle</text>
  <text x="260" y="264" text-anchor="middle" fill="#f7d9d5" font-size="8.5">reads · relays</text>

  <rect x="394" y="214" width="96" height="56" rx="8" fill="#0E6B82"/>
  <text x="442" y="238" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">Gateway</text>
  <text x="442" y="255" text-anchor="middle" fill="#cfe6ec" font-size="9.5">/ internet</text>

  <!-- red detour path: Alice -> Attacker -> Gateway -->
  <g stroke="#C0392B" stroke-width="3">
    <line x1="126" y1="240" x2="196" y2="240"/>
    <line x1="320" y1="240" x2="390" y2="240"/>
  </g>
  <polygon points="196,240 184,234 184,246" fill="#C0392B"/>
  <polygon points="390,240 378,234 378,246" fill="#C0392B"/>

  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#6b7280">ARP spoofing forces Alice's traffic to detour through the attacker.</text>
</svg>
