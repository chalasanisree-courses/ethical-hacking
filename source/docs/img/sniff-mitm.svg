<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 372" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="ARP spoofing inserts the attacker between the victim and the gateway: before, traffic flows straight to the real gateway; after forged ARP replies, every packet passes through the attacker first." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="860" height="372" fill="#fbfbfd" rx="14"/>

  <text x="430" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#26324f">ARP spoofing puts the attacker in the middle</text>
  <text x="430" y="54" text-anchor="middle" font-size="12" fill="#6b7280">ARP has no authentication — so a forged reply quietly reroutes the victim's traffic.</text>

  <!-- BEFORE -->
  <text x="70" y="90" font-size="11" font-weight="800" fill="#0E6B82" letter-spacing="0.06em">BEFORE — HEALTHY ARP</text>
  <g>
    <rect x="70"  y="100" width="150" height="56" rx="10" fill="#2B6CB0"/>
    <text x="145" y="124" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Victim</text>
    <text x="145" y="142" text-anchor="middle" fill="#d6e4f5" font-size="10.5">192.168.1.165</text>

    <rect x="470" y="100" width="150" height="56" rx="10" fill="#0E6B82"/>
    <text x="545" y="124" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Gateway</text>
    <text x="545" y="142" text-anchor="middle" fill="#cfe6ec" font-size="10.5">192.168.1.254</text>

    <line x1="220" y1="128" x2="462" y2="128" stroke="#5b8a3c" stroke-width="3"/>
    <polygon points="462,128 450,122 450,134" fill="#5b8a3c"/>
    <text x="341" y="120" text-anchor="middle" font-size="10.5" fill="#5b8a3c" font-weight="700">traffic → real gateway → internet</text>
  </g>

  <!-- AFTER -->
  <text x="70" y="214" font-size="11" font-weight="800" fill="#c0392b" letter-spacing="0.06em">AFTER — ARP POISONED</text>
  <g>
    <rect x="70"  y="224" width="150" height="56" rx="10" fill="#2B6CB0"/>
    <text x="145" y="248" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Victim</text>
    <text x="145" y="266" text-anchor="middle" fill="#d6e4f5" font-size="10.5">192.168.1.165</text>

    <rect x="355" y="224" width="150" height="56" rx="10" fill="#C0392B"/>
    <text x="430" y="248" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Attacker</text>
    <text x="430" y="266" text-anchor="middle" fill="#f7d9d5" font-size="10.5">de:ad:be:ef:00:99</text>

    <rect x="640" y="224" width="150" height="56" rx="10" fill="#0E6B82"/>
    <text x="715" y="248" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Gateway</text>
    <text x="715" y="266" text-anchor="middle" fill="#cfe6ec" font-size="10.5">192.168.1.254</text>

    <!-- victim -> attacker -->
    <line x1="220" y1="252" x2="347" y2="252" stroke="#C0392B" stroke-width="3"/>
    <polygon points="347,252 335,246 335,258" fill="#C0392B"/>
    <!-- attacker -> gateway (relay) -->
    <line x1="505" y1="252" x2="632" y2="252" stroke="#C0392B" stroke-width="3" stroke-dasharray="7 4"/>
    <polygon points="632,252 620,246 620,258" fill="#C0392B"/>
    <text x="568" y="244" text-anchor="middle" font-size="9.5" fill="#c0392b" font-weight="700">relays on</text>
  </g>

  <!-- forged replies -->
  <text x="145" y="308" text-anchor="middle" font-size="10" fill="#b3352a">forged: "192.168.1.254 is at de:ad…" → victim</text>
  <text x="715" y="308" text-anchor="middle" font-size="10" fill="#b3352a">forged: "192.168.1.165 is at de:ad…" → gateway</text>

  <text x="430" y="344" text-anchor="middle" font-size="11.5" fill="#26324f" font-weight="800">Every packet now passes through the attacker — <tspan fill="#c0392b">read it · capture credentials · modify it in transit</tspan></text>
</svg>
