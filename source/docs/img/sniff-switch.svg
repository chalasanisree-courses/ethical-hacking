<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Active sniffing on a switch: the switch sends each frame only to its destination port, so the attacker gets nothing and must ARP-spoof to force traffic through them." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="520" height="300" fill="#fbfbfd" rx="12"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" font-weight="800" fill="#26324f">Active — on a switch, force it to you</text>

  <!-- switch -->
  <rect x="196" y="44" width="128" height="42" rx="9" fill="#0E6B82"/>
  <text x="260" y="63" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">SWITCH</text>
  <text x="260" y="78" text-anchor="middle" fill="#cfe6ec" font-size="9.5">one port only</text>

  <!-- idle lines (grey) -->
  <g stroke="#cfd6e0" stroke-width="2">
    <line x1="260" y1="86" x2="66"  y2="208"/>
    <line x1="260" y1="86" x2="452" y2="208"/>
  </g>
  <!-- delivered line: switch -> Bob only (solid green) -->
  <line x1="260" y1="86" x2="192" y2="208" stroke="#3FA76B" stroke-width="3"/>
  <circle cx="226" cy="147" r="4.5" fill="#3FA76B"/>
  <!-- Alice -> switch (she sent to Bob) -->
  <line x1="66" y1="208" x2="248" y2="92" stroke="#3FA76B" stroke-width="2.2" stroke-dasharray="5 4"/>

  <!-- attacker gets nothing: X on attacker line -->
  <text x="360" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#c0392b">✗</text>

  <!-- ARP spoof forcing arrow: attacker -> switch (red) -->
  <path d="M 452 206 C 420 150, 360 120, 300 96" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <polygon points="300,96 312,98 305,108" fill="#c0392b"/>
  <text x="398" y="180" text-anchor="middle" font-size="9.5" fill="#c0392b" font-weight="700">ARP spoof →</text>

  <!-- devices -->
  <g>
    <rect x="26"  y="208" width="80" height="50" rx="7" fill="#E6F1FB" stroke="#b6cfe8"/>
    <text x="66"  y="230" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0C447C">Alice</text>
    <text x="66"  y="247" text-anchor="middle" font-size="9.5" fill="#3b6ea5">→ Bob</text>

    <rect x="152" y="208" width="80" height="50" rx="7" fill="#E6F1FB" stroke="#b6cfe8"/>
    <text x="192" y="230" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0C447C">Bob</text>
    <text x="192" y="247" text-anchor="middle" font-size="9.5" fill="#3b6ea5">gets it</text>

    <rect x="412" y="208" width="84" height="50" rx="7" fill="#C0392B"/>
    <text x="454" y="230" text-anchor="middle" font-size="11.5" font-weight="800" fill="#fff">Attacker</text>
    <text x="454" y="247" text-anchor="middle" font-size="9.5" fill="#f7d9d5">gets nothing</text>
  </g>

  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#6b7280">Each frame goes to one port — the attacker must force traffic to detour.</text>
</svg>
