<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Calibri, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#26324F"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E6B82"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- title -->
  <text x="40" y="42" font-size="27" font-weight="700" fill="#26324F">Resolving coca-cola.com — and who hosts each piece</text>
  <text x="40" y="70" font-size="15.5" fill="#6B7280">A domain name is looked up through a chain of DNS servers; then your browser connects straight to the web server’s IP.</text>

  <!-- ===================== MAIN DIAGRAM ===================== -->

  <!-- speech bubble -->
  <rect x="55" y="108" width="205" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="157" y="139" font-size="18" font-weight="700" fill="#26324F" text-anchor="middle">coca-cola.com</text>
  <path d="M132,158 L150,158 L138,178 z" fill="#FFFFFF" stroke="#CBD5E1"/>

  <!-- laptop -->
  <rect x="82" y="185" width="150" height="96" rx="7" fill="#26324F"/>
  <rect x="93" y="196" width="128" height="66" rx="3" fill="#FFFFFF"/>
  <rect x="104" y="206" width="106" height="15" rx="7.5" fill="#EEF2F7" stroke="#CBD5E1"/>
  <circle cx="199" cy="213.5" r="5" fill="none" stroke="#0E6B82" stroke-width="2"/>
  <line x1="203" y1="217" x2="208" y2="222" stroke="#0E6B82" stroke-width="2"/>
  <polygon points="118,281 196,281 214,301 100,301" fill="#26324F"/>
  <text x="157" y="322" font-size="14.5" font-weight="700" fill="#26324F" text-anchor="middle">Your browser</text>

  <!-- resolver -->
  <rect x="360" y="198" width="150" height="118" rx="9" fill="#26324F"/>
  <g stroke="#5A688A" stroke-width="6" stroke-linecap="round">
    <line x1="380" y1="222" x2="490" y2="222"/><line x1="380" y1="244" x2="490" y2="244"/>
    <line x1="380" y1="266" x2="490" y2="266"/><line x1="380" y1="288" x2="466" y2="288"/>
  </g>
  <circle cx="478" cy="288" r="4" fill="#F0A05A"/>
  <text x="435" y="340" font-size="15.5" font-weight="700" fill="#26324F" text-anchor="middle">DNS resolver</text>
  <text x="435" y="358" font-size="12.5" fill="#6B7280" text-anchor="middle">(your ISP / 8.8.8.8)</text>

  <!-- server stack glyph helper (root, tld, name) -->
  <!-- Root -->
  <rect x="760" y="92" width="165" height="82" rx="7" fill="#26324F"/>
  <g stroke="#5A688A" stroke-width="5" stroke-linecap="round">
    <line x1="778" y1="112" x2="907" y2="112"/><line x1="778" y1="130" x2="907" y2="130"/><line x1="778" y1="148" x2="907" y2="148"/></g>
  <rect x="940" y="115" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1015" y="139" font-size="15" font-weight="700" fill="#26324F" text-anchor="middle">Root server</text>

  <!-- TLD -->
  <rect x="760" y="208" width="165" height="82" rx="7" fill="#26324F"/>
  <g stroke="#5A688A" stroke-width="5" stroke-linecap="round">
    <line x1="778" y1="228" x2="907" y2="228"/><line x1="778" y1="246" x2="907" y2="246"/><line x1="778" y1="264" x2="907" y2="264"/></g>
  <rect x="940" y="231" width="190" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1035" y="255" font-size="15" font-weight="700" fill="#26324F" text-anchor="middle">TLD server (.com)</text>

  <!-- Name server (authoritative) -->
  <rect x="760" y="324" width="165" height="82" rx="7" fill="#0E6B82"/>
  <g stroke="#5FA6B8" stroke-width="5" stroke-linecap="round">
    <line x1="778" y1="344" x2="907" y2="344"/><line x1="778" y1="362" x2="907" y2="362"/><line x1="778" y1="380" x2="907" y2="380"/></g>
  <rect x="940" y="347" width="255" height="36" rx="18" fill="#FFFFFF" stroke="#0E6B82"/>
  <text x="1067" y="371" font-size="15" font-weight="700" fill="#0E6B82" text-anchor="middle">Authoritative name server</text>

  <!-- browser <-> resolver -->
  <line x1="235" y1="236" x2="352" y2="236" stroke="#26324F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="293" y="228" font-size="12.5" fill="#6B7280" text-anchor="middle">coca-cola.com?</text>
  <line x1="352" y1="272" x2="235" y2="272" stroke="#26324F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="293" y="289" font-size="12.5" font-weight="700" fill="#26324F" text-anchor="middle">IP: 52.14.144.171</text>

  <!-- resolver -> servers -->
  <line x1="515" y1="232" x2="754" y2="140" stroke="#26324F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="515" y1="255" x2="754" y2="250" stroke="#26324F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="515" y1="282" x2="754" y2="360" stroke="#0E6B82" stroke-width="2" marker-end="url(#arrowT)"/>

  <!-- step numbers -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="628" cy="179" r="12" fill="#26324F"/><text x="628" y="184" fill="#FFFFFF">1</text>
    <circle cx="628" cy="246" r="12" fill="#26324F"/><text x="628" y="251" fill="#FFFFFF">2</text>
    <circle cx="628" cy="326" r="12" fill="#0E6B82"/><text x="628" y="331" fill="#FFFFFF">3</text>
    <circle cx="337" cy="254" r="12" fill="#26324F"/><text x="337" y="259" fill="#FFFFFF">4</text>
    <circle cx="228" cy="352" r="12" fill="#C0392B"/><text x="228" y="357" fill="#FFFFFF">5</text>
  </g>

  <!-- browser -> web server -->
  <path d="M150,290 C150,360 210,392 296,404" fill="none" stroke="#C0392B" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="0"/>
  <text x="196" y="384" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="middle">then connect</text>

  <!-- web server (destination) -->
  <rect x="300" y="386" width="255" height="86" rx="9" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <rect x="316" y="404" width="46" height="50" rx="5" fill="#26324F"/>
  <g stroke="#5A688A" stroke-width="4" stroke-linecap="round"><line x1="324" y1="416" x2="354" y2="416"/><line x1="324" y1="429" x2="354" y2="429"/><line x1="324" y1="442" x2="354" y2="442"/></g>
  <text x="380" y="422" font-size="15.5" font-weight="700" fill="#26324F">Web server</text>
  <text x="380" y="445" font-size="15" fill="#26324F" font-family="Consolas, Menlo, monospace">52.14.144.171</text>

  <!-- ===================== TAKEAWAY CARDS ===================== -->
  <!-- card 1: DNS hosted off-site -->
  <rect x="40" y="502" width="580" height="172" rx="11" fill="#E9F1F4"/>
  <rect x="40" y="502" width="7" height="172" rx="3.5" fill="#0E6B82"/>
  <text x="70" y="536" font-size="17.5" font-weight="700" fill="#0E6B82">DNS is hosted off-site — not on your network</text>
  <text x="70" y="566" font-size="15" fill="#222222">The authoritative name server (step 3) usually isn’t on-prem.</text>
  <text x="70" y="590" font-size="15" fill="#222222">A provider runs it — <tspan font-weight="700">Azure DNS</tspan> or <tspan font-weight="700">AWS Route 53</tspan>.</text>
  <text x="70" y="620" font-size="15" fill="#222222">Coca-Cola → <tspan font-weight="700">Azure DNS</tspan></text>
  <text x="70" y="644" font-size="14.5" fill="#26324F" font-family="Consolas, Menlo, monospace">ns1-09.azure-dns.com</text>

  <!-- card 2: web server DMZ or cloud -->
  <rect x="640" y="502" width="600" height="172" rx="11" fill="#FBF0EA"/>
  <rect x="640" y="502" width="7" height="172" rx="3.5" fill="#B45309"/>
  <text x="670" y="536" font-size="17.5" font-weight="700" fill="#B45309">The web server: in the DMZ, or in the cloud</text>
  <text x="670" y="566" font-size="15" fill="#222222"><tspan font-weight="700">On-prem:</tspan> it sits in the <tspan font-weight="700">DMZ</tspan> — the internet-facing tier.</text>
  <text x="670" y="590" font-size="15" fill="#222222"><tspan font-weight="700">Cloud:</tspan> it’s a virtual server rented from a provider.</text>
  <text x="670" y="620" font-size="15" fill="#222222">Coca-Cola → <tspan font-weight="700">AWS</tspan> (EC2, us-east-2)</text>
  <text x="670" y="644" font-size="14.5" fill="#26324F" font-family="Consolas, Menlo, monospace">ec2-52-14-144-171.us-east-2.compute.amazonaws.com</text>

  <!-- note: DNS by Azure, web by AWS -->
  <text x="640" y="694" font-size="13.5" font-style="italic" fill="#6B7280" text-anchor="middle">Note: two different providers do two different jobs — Azure answers the name lookup, AWS hosts the web server.</text>
</svg>
